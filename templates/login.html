{% extends "portfolio_base.html" %}
{% block title %}Entrar · FinTrack{% endblock %}
{% block content %}
<section class="panel auth-card" aria-labelledby="login-title">
  <div class="intro">
    <p class="eyebrow">Acesso à carteira</p>
    <h1 id="login-title">Boas-vindas</h1>
    <p class="muted">Entre para acompanhar seus ativos e registrar compras.</p>
  </div>
  <form class="form-stack" method="post" action="/login">
    <label>Nome de usuário
      <input name="username" type="text" autocomplete="username" required>
    </label>
    <label>Senha
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="primary" type="submit">Entrar</button>
  </form>
  <p class="muted">No primeiro acesso, use um nome de usuário novo para criar sua conta.</p>
</section>
{% endblock %}
